<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
          "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
      
<h:head>
    <title>Erreur - Gestion des Notes</title>
    <h:outputStylesheet library="css" name="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <ui:include src="/includes/header.xhtml" />
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="alert alert-danger p-5">
                    <h1 class="display-1">❌</h1>
                    <h2 class="mb-4">Une erreur est survenue</h2>
                    
                    <p class="mb-4">
                        #{requestScope['jakarta.servlet.error.message'] != null ? 
                          requestScope['jakarta.servlet.error.message'] : 
                          'Une erreur inattendue s\'est produite.'}
                    </p>
                    
                    <p class="text-muted mb-4">
                        Code d'erreur: #{requestScope['jakarta.servlet.error.status_code']}
                    </p>
                    
                    <h:link value="Retour à l'accueil" outcome="/views/login" 
                           styleClass="btn btn-primary" />
                </div>
            </div>
        </div>
    </div>
    
    <ui:include src="/includes/footer.xhtml" />
</h:body>
</html>
