<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
      
<h:head>
    <title>Saisie des notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <ui:include src="/includes/header.xhtml" />
    
    <div class="container">
        <h1 class="mb-4">📝 Saisie des notes</h1>
        
        <h:messages globalOnly="true" styleClass="alert alert-info" />
        
        <h:form id="saisieForm">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Sélectionner le module</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Module :</label>
                                <h:selectOneMenu value="#{noteController.idMatiereSelectionnee}" 
                                                styleClass="form-select" required="true">
                                    <f:selectItem itemValue="0" itemLabel="-- Choisir un module --" />
                                    <f:selectItems value="#{professeurController.modules}" var="module" 
                                                  itemValue="#{module.id}" itemLabel="#{module.nom}" />
                                </h:selectOneMenu>
                            </div>
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <h:commandButton value="Charger les étudiants" 
                                           action="#{noteController.chargerNotesMatiere}"
                                           styleClass="btn btn-primary">
                                <f:ajax execute="@form" render="saisieSection" />
                            </h:commandButton>
                            <!-- Ajoutez ce bouton à côté de "Charger les étudiants" -->
<h:commandButton value="🔍 Tester" 
               action="#{noteController.testerConnexionModule}"
               styleClass="btn btn-info ms-2">
    <f:ajax execute="@form" render="saisieSection messages" />
</h:commandButton>
                        </div>
                    </div>
                </div>
            </div>
            
            <h:panelGroup id="saisieSection">
                <ui:fragment rendered="#{not empty noteController.notes}">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0">Saisie des notes</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>CNE</th>
                                            <th>Nom</th>
                                            <th>Prénom</th>
                                            <th>Note (/20)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ui:repeat value="#{noteController.notes}" var="note">
                                            <tr>
                                                <td>#{note.etudiant.cne}</td>
                                                <td>#{note.etudiant.nom}</td>
                                                <td>#{note.etudiant.prenom}</td>
                                                <td>
                                                    <h:inputText value="#{noteController.notesSaisies[note.etudiant.id]}" 
                                                               styleClass="form-control w-50" required="false">
                                                        <f:validateDoubleRange minimum="0" maximum="20" />
                                                    </h:inputText>
                                                </td>
                                            </tr>
                                        </ui:repeat>
                                    </tbody>
                                </table>
                            </div>
                            
                            <div class="mt-3">
                                <h:commandButton value="Enregistrer les notes" 
                                               action="#{noteController.enregistrerNotes}"
                                               styleClass="btn btn-success me-2">
                                    <f:ajax execute="@form" render="@form" />
                                </h:commandButton>
                                <h:button value="Annuler" outcome="/views/professeur/dashboard" 
                                         styleClass="btn btn-secondary" />
                            </div>
                        </div>
                    </div>
                </ui:fragment>
            </h:panelGroup>
        </h:form>
    </div>
    
    <ui:include src="/includes/footer.xhtml" />
</h:body>
</html>
