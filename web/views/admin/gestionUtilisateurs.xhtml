<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="jakarta.faces.passthrough">
      
<h:head>
    <title>Gestion des utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <ui:include src="/includes/header.xhtml" />
    
    <div class="container">
        <h1 class="mb-4">👥 Gestion des utilisateurs</h1>
        
        <h:messages globalOnly="true" styleClass="alert alert-info" />
        
        <h:form id="formUtilisateur">
            <!-- Formulaire d'ajout/modification -->
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <h:outputText value="#{utilisateurController.utilisateurSelectionne == null ? 'Ajouter un utilisateur' : 'Modifier un utilisateur'}" />
                    </h5>
                </div>
                <div class="card-body">
                    <!-- Rôle avec AJAX sur le changement -->
                    <div class="row" rendered="#{utilisateurController.utilisateurSelectionne == null}">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Rôle :</label>
                            <h:selectOneMenu value="#{utilisateurController.role}" 
                                           styleClass="form-select" required="true">
                                <f:selectItem itemValue="" itemLabel="-- Sélectionner un rôle --" />
                                <f:selectItem itemValue="ADMIN" itemLabel="Administrateur" />
                                <f:selectItem itemValue="PROFESSEUR" itemLabel="Professeur" />
                                <f:selectItem itemValue="ETUDIANT" itemLabel="Étudiant" />
                                <!-- AJOUT : Mettre à jour le formulaire quand le rôle change -->
                                <f:ajax execute="@this" render="champsSpecifiques" />
                            </h:selectOneMenu>
                        </div>
                    </div>
                    
                    <!-- Champs communs -->
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nom :</label>
                            <h:inputText value="#{utilisateurController.nom}" 
                                       styleClass="form-control" required="true"/>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Prénom :</label>
                            <h:inputText value="#{utilisateurController.prenom}" 
                                       styleClass="form-control" required="true"/>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Email :</label>
                            <h:inputText value="#{utilisateurController.email}" 
                                       styleClass="form-control" required="true"/>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Login :</label>
                            <h:inputText value="#{utilisateurController.login}" 
                                       styleClass="form-control" required="true"
                                       readonly="#{utilisateurController.utilisateurSelectionne != null}"/>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Mot de passe :</label>
                            <h:inputSecret value="#{utilisateurController.motDePasse}" 
                                         styleClass="form-control" 
                                         required="#{utilisateurController.utilisateurSelectionne == null}"/>
                        </div>
                    </div>
                    
                    <!-- Conteneur pour les champs spécifiques -->
                    <h:panelGroup id="champsSpecifiques">
                        <!-- Champs spécifiques Étudiant -->
                        <ui:fragment rendered="#{utilisateurController.role == 'ETUDIANT' or (utilisateurController.utilisateurSelectionne != null and utilisateurController.utilisateurSelectionne.class.simpleName == 'Etudiant')}">
                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">CNE :</label>
                                    <h:inputText value="#{utilisateurController.cne}" 
                                               styleClass="form-control" required="true"/>
                                </div>
                                <div class="col-md-3 mb-3">
    <label class="form-label">Date naissance :</label>
    <h:inputText value="#{utilisateurController.dateNaissanceAsString}" 
               styleClass="form-control" 
               p:placeholder="yyyy-MM-dd">
    </h:inputText>
</div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Classe :</label>
                                    <h:inputText value="#{utilisateurController.classe}" 
                                               styleClass="form-control"/>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Adresse :</label>
                                    <h:inputText value="#{utilisateurController.adresse}" 
                                               styleClass="form-control"/>
                                </div>
                            </div>
                        </ui:fragment>
                        
                        <!-- Champs spécifiques Professeur -->
                        <ui:fragment rendered="#{utilisateurController.role == 'PROFESSEUR' or (utilisateurController.utilisateurSelectionne != null and utilisateurController.utilisateurSelectionne.class.simpleName == 'Professeur')}">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Spécialité :</label>
                                    <h:inputText value="#{utilisateurController.specialite}" 
                                               styleClass="form-control"/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Grade :</label>
                                    <h:inputText value="#{utilisateurController.grade}" 
                                               styleClass="form-control"/>
                                </div>
                            </div>
                        </ui:fragment>
                        
                        <!-- Champs spécifiques Admin -->
                        <ui:fragment rendered="#{utilisateurController.role == 'ADMIN' or (utilisateurController.utilisateurSelectionne != null and utilisateurController.utilisateurSelectionne.class.simpleName == 'Administrateur')}">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fonction :</label>
                                    <h:inputText value="#{utilisateurController.fonction}" 
                                               styleClass="form-control"/>
                                </div>
                            </div>
                        </ui:fragment>
                    </h:panelGroup>
                    
                    <!-- Boutons -->
                    <div class="row">
                        <div class="col-12">
                            <!-- Bouton Ajouter (visible quand aucun utilisateur sélectionné) -->
                            <h:commandButton value="Ajouter" 
                                           action="#{utilisateurController.ajouterUtilisateur}"
                                           styleClass="btn btn-success me-2"
                                           rendered="#{utilisateurController.utilisateurSelectionne == null}">
                                <f:ajax execute="@form" render="@form" />
                            </h:commandButton>
                            
                            <!-- Bouton Modifier (visible quand un utilisateur est sélectionné) -->
                            <h:commandButton value="Modifier" 
                                           action="#{utilisateurController.modifierUtilisateur}"
                                           styleClass="btn btn-primary me-2"
                                           rendered="#{utilisateurController.utilisateurSelectionne != null}">
                                <f:ajax execute="@form" render="@form" />
                            </h:commandButton>
                            
                            <!-- Bouton Annuler (visible quand un utilisateur est sélectionné) -->
                            <h:commandButton value="Annuler" 
                                           action="#{utilisateurController.annulerModification}"
                                           styleClass="btn btn-secondary"
                                           rendered="#{utilisateurController.utilisateurSelectionne != null}">
                                <f:ajax execute="@this" render="@form" />
                            </h:commandButton>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Liste des utilisateurs (inchangée) -->
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Liste des utilisateurs</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nom</th>
                                    <th>Prénom</th>
                                    <th>Login</th>
                                    <th>Email</th>
                                    <th>Rôle</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <ui:repeat value="#{utilisateurController.utilisateurs}" var="u">
                                    <tr>
                                        <td>#{u.id}</td>
                                        <td>#{u.nom}</td>
                                        <td>#{u.prenom}</td>
                                        <td>#{u.login}</td>
                                        <td>#{u.email}</td>
                                        <td>
                                            <span class="badge #{u.role == 'ADMIN' ? 'bg-danger' : 
                                                              u.role == 'PROFESSEUR' ? 'bg-success' : 'bg-info'}">
                                                #{u.role}
                                            </span>
                                        </td>
                                        <td>
                                            <h:commandButton value="✏️ Modifier" 
                                                           styleClass="btn btn-sm btn-warning me-1"
                                                           action="#{utilisateurController.preparerModification(u)}">
                                                <f:ajax execute="@this" render="@form" />
                                            </h:commandButton>
                                            
                                            <h:commandButton value="🗑️ Supprimer" 
                                                           styleClass="btn btn-sm btn-danger"
                                                           action="#{utilisateurController.supprimerUtilisateur(u.id)}"
                                                           onclick="return confirm('Supprimer cet utilisateur ?')">
                                                <f:ajax execute="@this" render="@form" />
                                            </h:commandButton>
                                        </td>
                                    </tr>
                                </ui:repeat>
                                
                                <ui:fragment rendered="#{empty utilisateurController.utilisateurs}">
                                    <tr>
                                        <td colspan="7" class="text-center">Aucun utilisateur trouvé</td>
                                    </tr>
                                </ui:fragment>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </h:form>
    </div>
    
    <ui:include src="/includes/footer.xhtml" />
</h:body>
</html>
