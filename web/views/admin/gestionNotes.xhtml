<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
      
<h:head>
    <title>Gestion des notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <ui:include src="/includes/header.xhtml" />
    
    <div class="container">
        <h1 class="mb-4">📊 Gestion des notes</h1>
        
        <h:messages globalOnly="true" styleClass="alert alert-info" />
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Statistiques globales</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6>Moyenne générale</h6>
                                <h3>
                                    <h:outputText value="#{noteController.statistiques['moyenneGenerale']}">
                                        <f:convertNumber pattern="0.00"/>
                                    </h:outputText>
                                </h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6>Nombre de notes</h6>
                                <h3>
                                    <h:outputText value="#{noteController.statistiques['nombreNotes']}" />
                                </h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6>Note minimale</h6>
                                <h3 class="text-danger">
                                    <h:outputText value="#{noteController.statistiques['noteMin']}">
                                        <f:convertNumber pattern="0.00"/>
                                    </h:outputText>
                                </h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6>Note maximale</h6>
                                <h3 class="text-success">
                                    <h:outputText value="#{noteController.statistiques['noteMax']}">
                                        <f:convertNumber pattern="0.00"/>
                                    </h:outputText>
                                </h3>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <h:commandButton value="Actualiser les statistiques" 
                                   action="#{noteController.calculerStatistiques}"
                                   styleClass="btn btn-primary">
                        <f:ajax execute="@this" render="@form" />
                    </h:commandButton>
                </div>
            </div>
        </div>
    </div>
    
    <ui:include src="/includes/footer.xhtml" />
</h:body>
</html>
