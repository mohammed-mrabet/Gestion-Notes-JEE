<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
      
<h:head>
    <title>Connexion - Gestion des Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        /* j'ai trouvé ce style sur internet, je l'ai un peu adapté */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
    </style>
</h:head>

<h:body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="text-center mb-4">📚 Gestion des Notes</h1>
            <h2 class="text-center mb-4">BE2 - Mini-Projet JEE</h2>
            
            <!-- messages d'erreur -->
            <h:messages globalOnly="true" styleClass="alert alert-danger" />
            
            <h:form>
                <div class="mb-3">
                    <label class="form-label">Login :</label>
                    <h:inputText value="#{authentificationController.login}" 
                                 styleClass="form-control" required="true"/>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Mot de passe :</label>
                    <h:inputSecret value="#{authentificationController.motDePasse}" 
                                   styleClass="form-control" required="true"/>
                </div>
                
                <h:commandButton value="Se connecter" action="#{authentificationController.login()}" 
                                 styleClass="btn btn-primary w-100" />
            </h:form>
            
            <!-- comptes de test pour le prof -->
            <div class="mt-4 p-3 bg-light rounded">
                <p class="mb-2"><strong>Pour tester :</strong></p>
                <p class="mb-1">👤 admin / admin123</p>
                <p class="mb-1">👨‍🏫 k.alami / prof123</p>
                <p class="mb-1">👨‍🎓 y.cherkaoui / etudiant123</p>
            </div>
        </div>
    </div>
</h:body>
</html>
